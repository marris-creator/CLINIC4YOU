<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#163274"/>
      <stop offset="100%" style="stop-color:#145564"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <!-- Treatment bed -->
  <rect x="200" y="280" width="400" height="100" rx="14" fill="#1ea7b5" opacity="0.6"/>
  <rect x="200" y="260" width="400" height="30" rx="14" fill="#38bdc8" opacity="0.5"/>
  <!-- Pillow -->
  <rect x="560" y="268" width="50" height="22" rx="8" fill="#edfafa" opacity="0.3"/>
  <!-- Bed legs -->
  <rect x="220" y="380" width="20" height="40" rx="4" fill="#156b79" opacity="0.7"/>
  <rect x="560" y="380" width="20" height="40" rx="4" fill="#156b79" opacity="0.7"/>
  <!-- Floor -->
  <rect x="0" y="420" width="800" height="180" fill="#080f28" opacity="0.4"/>
  <!-- Soft lighting orbs -->
  <circle cx="400" cy="120" r="70" fill="#38bdc8" opacity="0.08"/>
  <circle cx="400" cy="120" r="40" fill="#74d7de" opacity="0.1"/>
  <!-- Equipment trolley -->
  <rect x="640" y="290" width="80" height="130" rx="8" fill="#156b79" opacity="0.7"/>
  <rect x="650" y="300" width="60" height="30" rx="4" fill="#1ea7b5" opacity="0.4"/>
  <!-- Flowers / decor -->
  <circle cx="130" cy="340" r="30" fill="#168797" opacity="0.4"/>
  <circle cx="110" cy="360" r="20" fill="#1ea7b5" opacity="0.35"/>
  <!-- Shelving -->
  <rect x="60" y="200" width="80" height="10" rx="3" fill="#1ea7b5" opacity="0.5"/>
  <rect x="60" y="240" width="80" height="10" rx="3" fill="#1ea7b5" opacity="0.5"/>
  <circle cx="80" cy="195" r="12" fill="#38bdc8" opacity="0.4"/>
  <circle cx="100" cy="195" r="10" fill="#74d7de" opacity="0.3"/>
  <!-- Label -->
  <text x="400" y="530" font-family="Georgia, serif" font-size="22" fill="#edfafa" text-anchor="middle" opacity="0.85">Aesthetic Treatment Room</text>
  <text x="400" y="558" font-family="Arial, sans-serif" font-size="14" fill="#74d7de" text-anchor="middle" opacity="0.7">Clinic4U · Phibsborough, Dublin 7</text>
