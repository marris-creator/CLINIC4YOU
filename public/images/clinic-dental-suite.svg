<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e2050"/>
      <stop offset="100%" style="stop-color:#145564"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1ea7b5"/>
      <stop offset="100%" style="stop-color:#38bdc8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Room floor -->
  <rect x="0" y="420" width="800" height="180" fill="#0a1a3a" opacity="0.6"/>
  <!-- Dental chair silhouette -->
  <rect x="260" y="280" width="280" height="20" rx="10" fill="url(#accent)" opacity="0.8"/>
  <rect x="280" y="220" width="240" height="70" rx="12" fill="#1ea7b5" opacity="0.7"/>
  <rect x="300" y="300" width="200" height="120" rx="8" fill="#168797" opacity="0.7"/>
  <rect x="360" y="360" width="80" height="80" rx="4" fill="#1ea7b5" opacity="0.5"/>
  <!-- Overhead light -->
  <ellipse cx="400" cy="100" rx="60" ry="20" fill="#38bdc8" opacity="0.6"/>
  <line x1="400" y1="120" x2="400" y2="200" stroke="#38bdc8" stroke-width="4" opacity="0.5"/>
  <ellipse cx="400" cy="210" rx="40" ry="14" fill="#74d7de" opacity="0.7"/>
  <!-- Equipment -->
  <rect x="120" y="300" width="60" height="120" rx="8" fill="#156b79" opacity="0.7"/>
  <rect x="130" y="310" width="40" height="50" rx="4" fill="#1ea7b5" opacity="0.4"/>
  <rect x="620" y="280" width="60" height="140" rx="8" fill="#156b79" opacity="0.7"/>
  <!-- Window -->
  <rect x="560" y="120" width="180" height="140" rx="4" fill="#edfafa" opacity="0.12"/>
  <line x1="650" y1="120" x2="650" y2="260" stroke="#edfafa" stroke-width="2" opacity="0.3"/>
  <line x1="560" y1="190" x2="740" y2="190" stroke="#edfafa" stroke-width="2" opacity="0.3"/>
  <!-- Label -->
  <text x="400" y="530" font-family="Georgia, serif" font-size="22" fill="#edfafa" text-anchor="middle" opacity="0.85">Modern Dental Suite</text>
  <text x="400" y="558" font-family="Arial, sans-serif" font-size="14" fill="#74d7de" text-anchor="middle" opacity="0.7">Clinic4U · Phibsborough, Dublin 7</text>
</svg>
