  <ellipse cx="310" cy="400" rx="50" ry="20" fill="#1ea7b5" opacity="0.35"/>
  <rect x="285" y="340" width="50" height="60" rx="8" fill="#1ea7b5" opacity="0.35"/>
  <!-- Books / files -->
  <rect x="540" y="270" width="60" height="45" rx="4" fill="#168797" opacity="0.6"/>
