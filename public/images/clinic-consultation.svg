  <rect x="580" y="120" width="110" height="80" rx="4" fill="#edfafa" opacity="0.05"/>
  <!-- Floor -->
  <rect x="0" y="410" width="800" height="190" fill="#040818" opacity="0.4"/>
  <!-- Label -->
  <text x="400" y="530" font-family="Georgia, serif" font-size="22" fill="#edfafa" text-anchor="middle" opacity="0.85">Private Consultation Room</text>
  <text x="400" y="558" font-family="Arial, sans-serif" font-size="14" fill="#74d7de" text-anchor="middle" opacity="0.7">Clinic4U · Phibsborough, Dublin 7</text>
