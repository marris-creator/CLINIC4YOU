  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <!-- Desk -->
  <rect x="180" y="310" width="440" height="15" rx="4" fill="#38bdc8" opacity="0.7"/>
  <rect x="190" y="325" width="420" height="80" rx="4" fill="#156b79" opacity="0.5"/>
  <!-- Monitor -->
  <rect x="330" y="210" width="140" height="100" rx="8" fill="#080f28" opacity="0.9"/>
  <rect x="340" y="220" width="120" height="80" rx="4" fill="#1ea7b5" opacity="0.2"/>
  <rect x="385" y="310" width="30" height="8" rx="2" fill="#156b79" opacity="0.8"/>
