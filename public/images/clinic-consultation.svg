  <line x1="160" y1="100" x2="160" y2="280" stroke="#edfafa" stroke-width="2" opacity="0.2"/>
  <line x1="80" y1="190" x2="240" y2="190" stroke="#edfafa" stroke-width="2" opacity="0.2"/>
  <!-- Diploma on wall -->
